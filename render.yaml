# Render Blueprint: New > Blueprint > pick this repo.
#
# Free plan: no persistent disk, so the SQLite database re-seeds on every restart or
# deploy, and the instance sleeps after 15 minutes idle (the first request then takes
# about a minute). For permanent data, switch to `plan: starter` and add:
#   disk: { name: eventsphere-data, mountPath: /data, sizeGB: 1 }
services:
  - type: web
    name: eventsphere
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Fixed Web Push keys, so notifications keep working across restarts.
      # Generate once with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Email-only demo login, for the class demo. Anyone can then sign in as any
      # @kiit.ac.in address or society rep, so set it to "false" afterwards.
      - key: ALLOW_DEV_LOGIN
        value: "true"
